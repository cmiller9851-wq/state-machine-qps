 name: Deploy Fintech State Machine Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fintech-state-machine
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    name: Code Quality & Tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest pytest-cov
      
      - name: Lint with ruff
        run: ruff check . --select=E9,F63,F7,F82 --output-format=full
      
      - name: Format check with ruff
        run: ruff format --check . || true
      
      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=xml || true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
        continue-on-error: true

  build-and-push:
    needs: quality-gate
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
      
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
      
      - name: Output image URI
        id: image
        run: echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to ECS Fargate
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        working-directory: terraform
        run: terraform init
      
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="container_image=${{ needs.build-and-push.outputs.image-uri }}" \
            -var="database_url=${{ secrets.DATABASE_URL }}" \
            -var="subnet_ids=${{ secrets.SUBNET_IDS }}" \
            -out=tfplan
      
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
      
      - name: Wait for ECS Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster fintech-state-machine-cluster \
            --services fintech-state-machine-service \
            --region ${{ env.AWS_REGION }}
      
      - name: Verify Deployment
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster fintech-state-machine-cluster \
            --services fintech-state-machine-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text)
          
          echo "Service Status: $SERVICE_STATUS"
          
          if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
            echo "Service is not active"
            exit 1
          fi
      
      - name: Post to Slack (optional)
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Fintech State Machine Deployment*\nStatus: ${{ job.status }}\nCommit: ${{ github.sha }}\nImage: ${{ needs.build-and-push.outputs.image-uri }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
